<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>単語鉄壁修行 2176 極限管理版</title>
    <style>
        :root {
            --bg: #0f172a;
            --container: #1e293b;
            --text: #f1f5f9;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --gray: #64748b;
            --accent: #8b5cf6;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); font-family: 'Helvetica Neue', Arial, sans-serif; color: var(--text); }
        
        #setup, #report { padding: 20px; min-height: 100vh; overflow-y: auto; }
        #setup { display: block; }
        #report, #app { display: none; }

        .container { max-width: 650px; margin: 0 auto; background: var(--container); border-radius: 28px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; font-weight: 900; }
        .label { font-size: 13px; font-weight: 800; color: var(--gray); margin: 15px 0 6px 4px; }
        
        .param-group { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px; margin-bottom: 10px; border: 1px solid #334155; }
        .param-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .param-title { font-size: 12px; font-weight: 800; color: var(--text); }
        
        .ctrl-btns { display: flex; align-items: center; gap: 8px; }
        .val-display { min-width: 50px; text-align: center; font-family: monospace; font-weight: 900; font-size: 16px; color: var(--primary); }
        
        .step-btn { width: 36px; height: 36px; background: #334155; border: none; border-radius: 10px; color: white; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .step-btn:active { background: var(--primary); }

        .section-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; margin-bottom: 20px; }
        .nav-item { font-size: 11px; padding: 8px 0; background: var(--gray); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        button.main-btn { width: 100%; height: 58px; border: none; border-radius: 18px; font-size: 20px; font-weight: 900; cursor: pointer; margin-top: 20px; background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        
        #app { position: fixed; inset: 0; background: var(--bg); flex-direction: column; padding: 20px; z-index: 100; }
        #card { flex: 1; background: var(--container); border-radius: 40px; margin: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 30px; text-align: center; border: 2px solid #334155; }
        #englishWord { font-size: 48px; font-weight: 900; letter-spacing: -1px; }
        #japaneseWord { font-size: 28px; margin-top: 25px; color: var(--primary); font-weight: 700; min-height: 1.2em; }
        
        .progress-container { width: 100%; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
        #progressBar { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
        
        .ans-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .ans-btn { height: 74px; border: none; border-radius: 24px; color: white; font-size: 22px; font-weight: 900; cursor: pointer; transition: transform 0.1s; }
        .ans-btn:active { transform: scale(0.95); }
        #correctBtn { background: var(--success); }
        #wrongBtn { background: var(--danger); }
        
        #gaugeContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background: rgba(255,255,255,0.05); }
        #gauge { height: 100%; background: var(--danger); width: 0%; }

        textarea#missedArea { width: 100%; height: 200px; background: rgba(0,0,0,0.3); color: #94a3b8; border: 1px solid #334155; border-radius: 14px; padding: 12px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div id="setup">
    <div class="container">
        <h1>単語鉄壁修行 2176 管理版</h1>
        
        <div class="label">修行範囲設定</div>
        <div class="param-group">
            <div class="param-row">
                <span class="param-title">開始番号</span>
                <div class="ctrl-btns">
                    <button class="step-btn" onclick="changeVal('rangeStart', -100)">--</button>
                    <button class="step-btn" onclick="changeVal('rangeStart', -1)">-</button>
                    <div id="disp_rangeStart" class="val-display">1</div>
                    <button class="step-btn" onclick="changeVal('rangeStart', 1)">+</button>
                    <button class="step-btn" onclick="changeVal('rangeStart', 100)">++</button>
                </div>
            </div>
            <div class="param-row">
                <span class="param-title">終了番号</span>
                <div class="ctrl-btns">
                    <button class="step-btn" onclick="changeVal('rangeEnd', -100)">--</button>
                    <button class="step-btn" onclick="changeVal('rangeEnd', -1)">-</button>
                    <div id="disp_rangeEnd" class="val-display">2176</div>
                    <button class="step-btn" onclick="changeVal('rangeEnd', 1)">+</button>
                    <button class="step-btn" onclick="changeVal('rangeEnd', 100)">++</button>
                </div>
            </div>
        </div>

        <div class="label">速度・時間管理</div>
        <div class="param-group">
            <div class="param-row">
                <span class="param-title">読み上げ速度</span>
                <div class="ctrl-btns">
                    <button class="step-btn" onclick="changeVal('speechRate', -0.1)">-</button>
                    <div id="disp_speechRate" class="val-display">1.6</div>
                    <button class="step-btn" onclick="changeVal('speechRate', 0.1)">+</button>
                </div>
            </div>
            <div class="param-row">
                <span class="param-title">英語表示(秒)</span>
                <div class="ctrl-btns">
                    <button class="step-btn" onclick="changeVal('engTime', -0.1)">-</button>
                    <div id="disp_engTime" class="val-display">1.0</div>
                    <button class="step-btn" onclick="changeVal('engTime', 0.1)">+</button>
                </div>
            </div>
            <div class="param-row">
                <span class="param-title">解答制限(秒)</span>
                <div class="ctrl-btns">
                    <button class="step-btn" onclick="changeVal('japTime', -0.1)">-</button>
                    <div id="disp_japTime" class="val-display">1.0</div>
                    <button class="step-btn" onclick="changeVal('japTime', 0.1)">+</button>
                </div>
            </div>
        </div>

        <div class="label">クイック選択</div>
        <div id="sectionContainer" class="section-grid"></div>

        <button id="startBtn" class="main-btn" onclick="initTraining()">修行開始</button>
    </div>
</div>

<div id="app">
    <div id="infoText" style="text-align:center; font-weight:bold; margin-bottom:10px; color:var(--gray);"></div>
    <div class="progress-container"><div id="progressBar"></div></div>
    
    <div id="card">
        <div id="englishWord"></div>
        <div id="japaneseWord"></div>
        <div id="gaugeContainer"><div id="gauge"></div></div>
    </div>

    <div class="ans-btns">
        <button id="wrongBtn" class="ans-btn" onclick="processAnswer(false)">苦手 (A)</button>
        <button id="correctBtn" class="ans-btn" onclick="processAnswer(true)">わかる (Z)</button>
    </div>
</div>

<div id="report">
    <div class="container" style="text-align:center;">
        <h1>修行完了</h1>
        <div id="resultScore" style="font-size:24px; font-weight:900; margin:20px 0; color:var(--success);"></div>
        <textarea id="missedArea" readonly></textarea>
        <button class="main-btn" onclick="location.reload()">トップに戻る</button>
    </div>
</div>

let params = {
    rangeStart: 1,
    rangeEnd: 2176,
    speechRate: 1.6,
    engTime: 1.0,
    japTime: 1.0
};

let currentQueue = [], trainingResults = [], activeWord = null;
let engTimer = null, japTimer = null;

window.onload = () => {
    const saved = localStorage.getItem("teppeki_full_state_v2");
    if(saved) params = {...params, ...JSON.parse(saved)};
    updateAllDisplays();
    renderSections();
};

function changeVal(key, step) {
    params[key] = parseFloat((params[key] + step).toFixed(1));
    if(params[key] < 0.1) params[key] = 0.1;
    if(key.includes('range')) params[key] = Math.max(1, Math.round(params[key]));
    updateAllDisplays();
    localStorage.setItem("teppeki_full_state_v2", JSON.stringify(params));
}

function updateAllDisplays() {
    Object.keys(params).forEach(key => {
        const el = document.getElementById(`disp_${key}`);
        if(el) el.textContent = params[key];
    });
}

function renderSections() {
    const nav = document.getElementById("sectionContainer");
    nav.innerHTML = "";
    for(let i=1; i<=2176; i+=100) {
        const end = Math.min(i+99, 2176);
        const btn = document.createElement("button");
        btn.className = "nav-item";
        btn.textContent = `${i}-${end}`;
        btn.onclick = () => {
            params.rangeStart = i;
            params.rangeEnd = end;
            updateAllDisplays();
        };
        nav.appendChild(btn);
    }
}

function initTraining() {
    const lines = FULL_DATA.trim().split("\n");
    const targets = lines.slice(params.rangeStart - 1, params.rangeEnd).map(l => {
        const p = l.split(",");
        return { en: p[0].trim(), ja: p[1].trim() };
    });

    currentQueue = targets.sort(() => Math.random() - 0.5);
    trainingResults = [];
    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "flex";
    nextWord();
}

function nextWord() {
    if(currentQueue.length === 0) return finishTraining();
    
    activeWord = currentQueue.pop();
    const total = trainingResults.length + currentQueue.length + 1;
    document.getElementById("infoText").textContent = `${trainingResults.length + 1} / ${total}`;
    document.getElementById("progressBar").style.width = `${(trainingResults.length / total) * 100}%`;
    
    const cardEn = document.getElementById("englishWord");
    const cardJa = document.getElementById("japaneseWord");
    cardEn.textContent = activeWord.en;
    cardJa.textContent = "";
    
    const gauge = document.getElementById("gauge");
    gauge.style.transition = "none";
    gauge.style.width = "0%";

    // 英語読み上げ（遅延防止）
    speak(activeWord.en, "en-US");

    // 英語表示時間経過後に解答表示
    clearTimeout(engTimer);
    engTimer = setTimeout(showAnswer, params.engTime * 1000);
}

function showAnswer() {
    document.getElementById("japaneseWord").textContent = activeWord.ja;
    speak(activeWord.ja, "ja-JP");

    const gauge = document.getElementById("gauge");
    gauge.style.transition = `width ${params.japTime}s linear`;
    gauge.style.width = "100%";

    // 解答制限時間経過後に強制NG
    clearTimeout(japTimer);
    japTimer = setTimeout(() => processAnswer(false), params.japTime * 1000);
}

function processAnswer(isCorrect) {
    clearTimeout(engTimer);
    clearTimeout(japTimer);
    trainingResults.push({ ...activeWord, ok: isCorrect });
    nextWord();
}

function speak(text, lang) {
    speechSynthesis.cancel(); // 既存の音声を即座に停止
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = params.speechRate;
    speechSynthesis.speak(u);
}

function finishTraining() {
    document.getElementById("app").style.display = "none";
    document.getElementById("report").style.display = "block";
    const missed = trainingResults.filter(r => !r.ok);
    document.getElementById("resultScore").textContent = `正解: ${trainingResults.length - missed.length} / ${trainingResults.length}`;
    document.getElementById("missedArea").value = missed.map(m => `${m.en},${m.ja}`).join("\n");
}

document.onkeydown = (e) => {
    if(document.getElementById("app").style.display === "flex") {
        const k = e.key.toLowerCase();
        if(k === "z") processAnswer(true);
        if(k === "a") processAnswer(false);
    }
};
