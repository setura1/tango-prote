<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>単語鉄壁修行 2176 完全版</title>
    <style>
        :root {
            --bg: #f8fafc;
            --container: #ffffff;
            --text: #1e293b;
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --gray: #64748b;
            --accent: #8b5cf6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --container: #1e293b;
                --text: #f1f5f9;
                --primary: #3b82f6;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); font-family: 'Helvetica Neue', Arial, sans-serif; color: var(--text); }
        
        #setup, #report { padding: 20px; min-height: 100vh; }
        #setup { display: block; }
        #report, #app { display: none; }

        .container { max-width: 650px; margin: 0 auto; background: var(--container); border-radius: 28px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; font-weight: 900; }
        .label { font-size: 13px; font-weight: 800; color: var(--gray); margin: 15px 0 6px 4px; }
        
        textarea, input { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; font-size: 15px; background: rgba(0,0,0,0.02); color: inherit; }
        textarea { height: 120px; font-family: monospace; font-size: 12px; resize: none; }
        
        /* 単語追加フォーム */
        .add-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 10px; }
        .add-box input { padding: 10px; font-size: 14px; }
        .add-btn { background: var(--accent); color: white; border: none; padding: 0 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* セクションナビ */
        .section-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .nav-item { font-size: 11px; padding: 8px 0; background: var(--gray); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; opacity: 0.8; }
        .nav-item:hover { opacity: 1; }

        .num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .num-ctrl { display: flex; align-items: center; gap: 5px; }
        .step { width: 45px; height: 45px; background: #e2e8f0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #1e293b; }

        /* 読み上げ速度調整用 */
        .slider-container { margin: 15px 0; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 14px; border: 1.5px solid #e2e8f0; }
        .slider-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--gray); margin-bottom: 8px; }
        input[type="range"] { padding: 0; height: 8px; cursor: pointer; }

        button.main-btn { width: 100%; height: 58px; border: none; border-radius: 18px; font-size: 18px; font-weight: 800; cursor: pointer; transition: transform 0.1s; margin-top: 20px; }
        button.main-btn:active { transform: scale(0.96); }
        #startBtn { background: var(--primary); color: white; }
        
        /* 修行画面 */
        #app { position: fixed; inset: 0; background: var(--bg); flex-direction: column; padding: 20px; z-index: 100; }
        #card { flex: 1; background: var(--container); border-radius: 40px; margin: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 30px; text-align: center; }
        #englishWord { font-size: 42px; font-weight: 900; }
        #japaneseWord { font-size: 26px; margin-top: 25px; color: var(--primary); font-weight: 700; min-height: 1.2em; }
        
        .progress-container { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
        #progressBar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        .ans-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .ans-btn { height: 70px; border: none; border-radius: 20px; color: white; font-size: 20px; font-weight: 800; cursor: pointer; }
        #correctBtn { background: var(--success); }
        #wrongBtn { background: var(--danger); }
        
        #gaugeContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background: rgba(0,0,0,0.05); }
        #gauge { height: 100%; background: var(--danger); width: 0%; }
    </style>
</head>
<body>

<div id="setup">
    <div class="container">
        <h1>単語鉄壁修行 2176 <span id="wordCountBadge" style="background:var(--primary);color:white;padding:2px 10px;border-radius:15px;font-size:12px;">0語</span></h1>
        
        <div class="label">単語をリストの末尾に追加</div>
        <div class="add-box">
            <input type="text" id="newEn" placeholder="英語">
            <input type="text" id="newJa" placeholder="意味">
            <button class="add-btn" onclick="addNewEntry()">追加</button>
        </div>

        <div class="label">修行リスト (CSV形式)</div>
        <textarea id="wordListArea" spellcheck="false"></textarea>

        <div class="label">100語セクション・クイック選択</div>
        <div id="sectionContainer" class="section-grid"></div>

        <div class="num-row">
            <div>
                <div class="label">開始番号</div>
                <div class="num-ctrl">
                    <button class="step" onclick="changeNum('rangeStart', -100)">-</button>
                    <input type="number" id="rangeStart" value="1">
                    <button class="step" onclick="changeNum('rangeStart', 100)">+</button>
                </div>
            </div>
            <div>
                <div class="label">終了番号</div>
                <div class="num-ctrl">
                    <button class="step" onclick="changeNum('rangeEnd', -100)">-</button>
                    <input type="number" id="rangeEnd" value="2176">
                    <button class="step" onclick="changeNum('rangeEnd', 100)">+</button>
                </div>
            </div>
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>読み上げ速度</span>
                <span id="speedValue">1.4</span>
            </div>
            <input type="range" id="speechRate" min="0.5" max="2.5" step="0.1" value="1.4" oninput="updateSpeedLabel(this.value)">
        </div>

        <button id="startBtn" class="main-btn" onclick="initTraining()">修行開始</button>
    </div>
</div>

<div id="app">
    <div id="infoText" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
    <div class="progress-container"><div id="progressBar"></div></div>
    
    <div id="card">
        <div id="englishWord">Ready</div>
        <div id="japaneseWord"></div>
        <div id="gaugeContainer"><div id="gauge"></div></div>
    </div>

    <div class="ans-btns">
        <button id="wrongBtn" class="ans-btn" onclick="processAnswer(false)">苦手 (A)</button>
        <button id="correctBtn" class="ans-btn" onclick="processAnswer(true)">わかる (Z)</button>
    </div>
</div>

<div id="report">
    <div class="container" style="text-align:center;">
        <h1>修行完了</h1>
        <div id="resultScore" style="font-size:24px; font-weight:900; margin:20px 0;"></div>
        <textarea id="missedArea" readonly style="height:150px; margin-bottom:15px;"></textarea>
        <button class="main-btn" style="background:var(--gray); color:white;" onclick="location.reload()">トップに戻る</button>
    </div>
</div>

// --- [ロジック変数] ---
const area = document.getElementById("wordListArea");
let currentQueue = [], trainingResults = [], activeWord = null, trainingTimer = null;

// --- [初期化処理] ---
window.onload = () => {
    const saved = localStorage.getItem("teppeki_full_state");
    if(saved) {
        const data = JSON.parse(saved);
        area.value = data.list || FULL_DATA;
        document.getElementById("rangeStart").value = data.s || 1;
        document.getElementById("rangeEnd").value = data.e || 2176;
        if(data.rate) {
            document.getElementById("speechRate").value = data.rate;
            document.getElementById("speedValue").textContent = data.rate;
        }
    } else {
        area.value = FULL_DATA;
    }
    updateCounterAndNav();
};

function updateSpeedLabel(val) {
    document.getElementById("speedValue").textContent = val;
    saveCurrentState();
}

function updateCounterAndNav() {
    const lines = area.value.trim().split("\n").filter(l => l.includes(","));
    document.getElementById("wordCountBadge").textContent = `${lines.length}語`;
    
    const nav = document.getElementById("sectionContainer");
    nav.innerHTML = "";
    for(let i=1; i<=lines.length; i+=100) {
        const end = Math.min(i+99, lines.length);
        const btn = document.createElement("button");
        btn.className = "nav-item";
        btn.textContent = `${i}-${end}`;
        btn.onclick = () => {
            document.getElementById("rangeStart").value = i;
            document.getElementById("rangeEnd").value = end;
            saveCurrentState();
        };
        nav.appendChild(btn);
    }
    saveCurrentState();
}

area.oninput = updateCounterAndNav;

function saveCurrentState() {
    localStorage.setItem("teppeki_full_state", JSON.stringify({
        list: area.value,
        s: document.getElementById("rangeStart").value,
        e: document.getElementById("rangeEnd").value,
        rate: document.getElementById("speechRate").value
    }));
}

function changeNum(id, step) {
    const el = document.getElementById(id);
    el.value = Math.max(1, parseInt(el.value) + step);
    saveCurrentState();
}

function addNewEntry() {
    const en = document.getElementById("newEn").value.trim();
    const ja = document.getElementById("newJa").value.trim();
    if(!en || !ja) return;
    const currentLines = area.value.trim().split("\n");
    area.value = area.value.trim() + `\n${en},${ja}${currentLines.length + 1}`;
    document.getElementById("newEn").value = "";
    document.getElementById("newJa").value = "";
    updateCounterAndNav();
}

// --- [修行コアロジック] ---
function initTraining() {
    const allLines = area.value.trim().split("\n").filter(l => l.includes(","));
    const start = parseInt(document.getElementById("rangeStart").value) - 1;
    const end = parseInt(document.getElementById("rangeEnd").value);
    
    const targets = allLines.slice(start, end).map(line => {
        const parts = line.split(",");
        return { en: parts[0].trim(), ja: parts[1].trim() };
    });

    if(targets.length === 0) return alert("範囲外です");

    currentQueue = targets.sort(() => Math.random() - 0.5);
    trainingResults = [];
    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "flex";
    nextWord();
}

async function nextWord() {
    if(currentQueue.length === 0) return finishTraining();
    
    activeWord = currentQueue.pop();
    const total = trainingResults.length + currentQueue.length + 1;
    document.getElementById("infoText").textContent = `${trainingResults.length + 1} / ${total}`;
    document.getElementById("progressBar").style.width = `${(trainingResults.length / total) * 100}%`;
    
    document.getElementById("englishWord").textContent = activeWord.en;
    document.getElementById("japaneseWord").textContent = "";
    
    const limit = 2000; // 制限時間2秒
    const gauge = document.getElementById("gauge");
    gauge.style.transition = "none";
    gauge.style.width = "0%";
    
    setTimeout(() => {
        gauge.style.transition = `width ${limit}ms linear`;
        gauge.style.width = "100%";
    }, 10);

    trainingTimer = setTimeout(() => {
        showAnswer();
    }, limit);

    await speak(activeWord.en, "en-US");
}

function showAnswer() {
    clearTimeout(trainingTimer);
    document.getElementById("japaneseWord").textContent = activeWord.ja;
    speak(activeWord.ja, "ja-JP");
}

function processAnswer(isCorrect) {
    clearTimeout(trainingTimer);
    trainingResults.push({ ...activeWord, ok: isCorrect });
    nextWord();
}

function finishTraining() {
    document.getElementById("app").style.display = "none";
    document.getElementById("report").style.display = "block";
    const missed = trainingResults.filter(r => !r.ok);
    document.getElementById("resultScore").textContent = `正解: ${trainingResults.length - missed.length} / ${trainingResults.length}`;
    document.getElementById("missedArea").value = missed.map(m => `${m.en},${m.ja}`).join("\n");
}

function speak(text, lang) {
    return new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang; 
        // 読み上げ速度をスライダーの値から取得
        u.rate = parseFloat(document.getElementById("speechRate").value);
        u.onend = resolve;
        speechSynthesis.speak(u);
    });
}

// キーボード操作
document.onkeydown = (e) => {
    if(document.getElementById("app").style.display === "flex") {
        if(e.key.toLowerCase() === "z") processAnswer(true);
        if(e.key.toLowerCase() === "a") processAnswer(false);
    }
};
